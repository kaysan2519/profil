<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Deep Midnight Purple Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#110726" />
      <stop offset="45%" stop-color="#2a0d4a" />
      <stop offset="75%" stop-color="#1a0933" />
      <stop offset="100%" stop-color="#0a0314" />
    </linearGradient>

    <!-- Ambient Glowing Lights -->
    <radialGradient id="purple-glow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.32" />
      <stop offset="50%" stop-color="#7c3aed" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cyan-glow" cx="15%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="pink-glow" cx="88%" cy="15%" r="55%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="dot-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#e9d5ff" fill-opacity="0.18" />
    </pattern>

    <!-- Title Gradient -->
    <linearGradient id="title-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f5f3ff" />
      <stop offset="85%" stop-color="#e9d5ff" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Subtitle Gradient -->
    <linearGradient id="role-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#e879f9" />
      <stop offset="100%" stop-color="#a78bfa" />
    </linearGradient>

    <!-- Subtle Glow Shadow Filter -->
    <filter id="glow-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .font-mono { font-family: "JetBrains Mono", "Fira Code", monospace; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="340" rx="18" fill="url(#bg)" stroke="#4c1d95" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Ambient Glow Overlays -->
  <rect width="1200" height="340" rx="18" fill="url(#purple-glow)" />
  <rect width="1200" height="340" rx="18" fill="url(#cyan-glow)" />
  <rect width="1200" height="340" rx="18" fill="url(#pink-glow)" />

  <!-- Decorative Dot Grid -->
  <rect width="1200" height="340" rx="18" fill="url(#dot-grid)" />

  <!-- Geometric Decorative Lines / Tech Accent Waves -->
  <path d="M 0 260 Q 300 200, 600 260 T 1200 240" fill="none" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.25" />
  <path d="M 0 280 Q 400 320, 800 260 T 1200 290" fill="none" stroke="#c084fc" stroke-width="1" stroke-opacity="0.18" />

  <!-- Status Pill Badge (Centered) -->
  <g transform="translate(425, 45)">
    <rect width="350" height="32" rx="16" fill="#1e1035" fill-opacity="0.85" stroke="#7c3aed" stroke-width="1" stroke-opacity="0.5" />
    <!-- Pulsing Green Dot -->
    <circle cx="20" cy="16" r="4.5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="36" y="21" class="font-mono" font-size="11.5" font-weight="600" fill="#ddd6fe" letter-spacing="1.5">
      FULLSTACK &amp; SOFTWARE ENGINEER
    </text>
  </g>

  <!-- Name / Main Title -->
  <text x="600" y="155" text-anchor="middle" class="font-sans" font-size="56" font-weight="900" fill="url(#title-gradient)" letter-spacing="-1.2">
    Muhammad Kaysan
  </text>

  <!-- Role / Subtitle -->
  <text x="600" y="200" text-anchor="middle" class="font-sans" font-size="22" font-weight="700" fill="url(#role-gradient)" letter-spacing="0.5">
    Fullstack Developer &#8226; Creative Software Engineer
  </text>

  <!-- Description / Bio Line -->
  <text x="600" y="240" text-anchor="middle" class="font-sans" font-size="15" font-weight="400" fill="#cbd5e1" opacity="0.9">
    Architecting scalable web architectures, fluid frontend ecosystems &amp; robust backend services.
  </text>

  <!-- Bottom Accent Tech Pills (Centered) -->
  <g transform="translate(600, 275)" text-anchor="middle">
    <text class="font-mono" font-size="12" fill="#a78bfa" opacity="0.9" letter-spacing="1">
      ✦ TYPESCRIPT &#8226; NEXT.JS &#8226; REACT 19 &#8226; FLUTTER &#8226; NODE.JS &#8226; PRISMA &#8226; TAILWIND CSS ✦
    </text>
  </g>
</svg>
